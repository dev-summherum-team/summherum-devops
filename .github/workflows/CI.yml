name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: MongoDB bereitstellen (Warten auf Start)
        run: |
          for i in {1..30}; do
            nc -z localhost 27017 && echo "MongoDB ready" && exit 0
            sleep 1
          done
          echo "MongoDB not ready" && exit 1

      - name: Build und Tests
        env:
          MONGO_URI: mongodb://localhost:27017
        run: mvn clean verify

      - name: Artefakt 
        uses: actions/upload-artifact@v4
        with:
            name: Reisetagebuch
            path: target/*.jar

  docker:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        
      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: JAR bauen
        run: mvn clean package -DskipTests

      - name: Login in GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen
        run: |
          docker build -t ghcr.io/${{ github.repository }}/reisetagebuch:latest .

      - name: Docker Image pushen
        run: |
          docker push ghcr.io/${{ github.repository }}/reisetagebuch:latest
