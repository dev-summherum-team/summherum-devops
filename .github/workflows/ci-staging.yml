name: CI/CD Staging

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build und Tests
        env:
          MONGO_URI: mongodb://localhost:27017
        run: mvn clean verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: JAR bauen
        run: mvn clean package -DskipTests

      - name: Login in GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen
        run: docker build -t ghcr.io/${{ github.repository }}/reisetagebuch:${{ github.sha }} .

      - name: Docker Image pushen
        run: docker push ghcr.io/${{ github.repository }}/reisetagebuch:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: reisetagebuch-staging
          resourceGroup: summherum-devops
          imageToDeploy: ghcr.io/${{ github.repository }}/reisetagebuch:${{ github.sha }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging

    steps:
      - name: Warten bis die App gestartet ist
        run: sleep 30

      - name: Datenbankverbindung testen
        env:
          URL: ${{ secrets.URL }}
        run: curl --fail "$URL/health/db"
