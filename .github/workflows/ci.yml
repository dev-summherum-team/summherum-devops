name: CI and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop
      - 'feature/**'
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: MongoDB bereitstellen
        run: |
          for i in {1..30}; do
            nc -z localhost 27017 && echo "MongoDB ready" && exit 0
            sleep 1
          done
          echo "MongoDB not ready" && exit 1

      - name: Build und Tests
        env:
          MONGO_URI: mongodb://localhost:27017
        run: mvn clean verify

  build-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: JAR bauen
        run: mvn clean package -DskipTests

      - name: Login in GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen
        run: docker build -t ghcr.io/${{ github.repository }}/reisetagebuch:${{ github.sha }} .

      - name: Docker Image pushen
        run: docker push ghcr.io/${{ github.repository }}/reisetagebuch:${{ github.sha }}

  deploy-staging:
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    needs: build-image
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: reisetagebuch-staging
          resourceGroup: summherum-devops
          imageToDeploy: ghcr.io/${{ github.repository }}/reisetagebuch:${{ github.sha }}

  smoke-test-staging:
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging

    steps:
      - name: Warten auf Health-Endpoint
        env:
          URL: ${{ secrets.URL }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error "$URL/health/db"; then
              echo "Service is ready"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 5
          done
          echo "Service did not become ready in time"
          exit 1

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-image
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: reisetagebuch-prod
          resourceGroup: summherum-devops
          imageToDeploy: ghcr.io/${{ github.repository }}/reisetagebuch:${{ github.sha }}

  smoke-test-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy-production
    environment: production

    steps:
      - name: Warten auf Health-Endpoint
        env:
          URL: ${{ secrets.URL }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error "$URL/health/db"; then
              echo "Service is ready"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 5
          done
          echo "Service did not become ready in time"
          exit 1
